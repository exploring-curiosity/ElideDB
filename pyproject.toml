[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "elidedb"
version = "2.0.0"
description = "Video memory: ask a corpus when did something like this happen, get timestamps back"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=15",
  "numpy",
  "pandas",
  "duckdb",
  "pillow",
  "opencv-python",
  "mlx-embeddings",
  "scikit-learn",   
  "hdbscan",
  "umap-learn",
  "matplotlib",
  "jupyter",
]

[project.optional-dependencies]
# semantic search (local SigLIP on Apple Silicon) + clustering + map layout
ml = ["mlx-embeddings", "scikit-learn", "hdbscan", "umap-learn"]

[project.scripts]
elidedb = "elidedb.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
elidedb = ["desk_ui.html"]
